name: GenerateBuilds

on:
  push:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-port-o2r:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: sudo apt-get install gcc g++ git cmake ninja-build lsb-release
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.13
      with:
        key: ${{ runner.os }}-o2r-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-ccache-${{ github.ref }}
          ${{ runner.os }}-o2r-ccache-
    - name: Cache build folders
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-o2r-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-o2r-build-${{ github.ref }}
          ${{ runner.os }}-o2r-build-
        path: |
          torch/cmake-build-release
    - name: Generate spaghetti.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        make -C torch type=release -j3
        torch/cmake-build-release/torch pack assets spaghetti.o2r o2r
    - uses: actions/upload-artifact@v4
      with:
        name: spaghetti.o2r
        path: spaghetti.o2r
        retention-days: 1

  build-macos-arm64:
    needs: generate-port-o2r
    runs-on: macOS-latest
    strategy:
      matrix:
        config: [Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install dependencies
        run: brew install ninja cmake
      - name: Build
        run: |
          cmake -H. -Bbuild-cmake -GNinja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DENABLE_VCPKG=ON
          cmake --build build-cmake --config ${{ matrix.config }} -j3
      - name: Download spaghetti.o2r
        uses: actions/download-artifact@v4
        with:
          name: spaghetti.o2r
          path: ./build-cmake
      - name: Create Package
        run: |
          APP=build-cmake/SpaghettiKart.app
          # Insert the canonical spaghetti.o2r from the generate-port-o2r job and
          # the controller database, then re-sign since the bundle contents changed.
          cp build-cmake/spaghetti.o2r $APP/Contents/Resources/spaghetti.o2r
          wget -O $APP/Contents/Resources/gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          codesign --force --deep --sign - --options runtime --entitlements cmake/macos/entitlements.plist $APP
          mkdir spaghetti-${{ matrix.config }}
          # Ship a .dmg like the other HarbourMasters macOS ports: a disk image
          # survives GitHub's own artifact zip intact, so the download expands in
          # one step and the app can be dragged straight to Applications.
          STAGE=dmg-staging
          mkdir -p $STAGE
          ditto $APP $STAGE/SpaghettiKart.app
          ln -s /Applications $STAGE/Applications
          hdiutil create -volname SpaghettiKart -srcfolder $STAGE -ov -format UDZO spaghetti-${{ matrix.config }}/SpaghettiKart.dmg
          cp README.md spaghetti-${{ matrix.config }}/readme.txt
      - name: Publish packaged artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
            name: spaghetti-mac-arm64
            path: spaghetti-${{ matrix.config }}
  
  build-macos-intel:
    needs: generate-port-o2r
    runs-on: macos-15-intel
    strategy:
      matrix:
        config: [Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install dependencies
        run: brew install ninja cmake
      - name: Build
        run: |
          cmake -H. -Bbuild-cmake -GNinja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DENABLE_VCPKG=ON
          cmake --build build-cmake --config ${{ matrix.config }} -j3
      - name: Download spaghetti.o2r
        uses: actions/download-artifact@v4
        with:
          name: spaghetti.o2r
          path: ./build-cmake
      - name: Create Package
        run: |
          APP=build-cmake/SpaghettiKart.app
          # Insert the canonical spaghetti.o2r from the generate-port-o2r job and
          # the controller database, then re-sign since the bundle contents changed.
          cp build-cmake/spaghetti.o2r $APP/Contents/Resources/spaghetti.o2r
          wget -O $APP/Contents/Resources/gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          codesign --force --deep --sign - --options runtime --entitlements cmake/macos/entitlements.plist $APP
          mkdir spaghetti-${{ matrix.config }}
          # Ship a .dmg like the other HarbourMasters macOS ports: a disk image
          # survives GitHub's own artifact zip intact, so the download expands in
          # one step and the app can be dragged straight to Applications.
          STAGE=dmg-staging
          mkdir -p $STAGE
          ditto $APP $STAGE/SpaghettiKart.app
          ln -s /Applications $STAGE/Applications
          hdiutil create -volname SpaghettiKart -srcfolder $STAGE -ov -format UDZO spaghetti-${{ matrix.config }}/SpaghettiKart.dmg
          cp README.md spaghetti-${{ matrix.config }}/readme.txt
      - name: Publish packaged artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
            name: spaghetti-mac-intel-x64
            path: spaghetti-${{ matrix.config }}
